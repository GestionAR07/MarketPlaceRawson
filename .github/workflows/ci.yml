name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Format admin redesign files
        run: >-
          npx prettier --write
          src/app/admin/geography/geography-forms.tsx
          src/app/admin/merchant-applications/application-approve-form.tsx
          src/app/admin/merchant-applications/page.tsx
          'src/app/admin/merchants/[merchantId]/page.tsx'
          src/app/admin/merchants/merchant-create-form.tsx
          src/app/admin/merchants/new/page.tsx

      - name: Upload formatted admin tree
        uses: actions/upload-artifact@v4
        with:
          name: admin-redesign-prettier-tree
          path: src/app/admin

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smokes
        run: npm run e2e
