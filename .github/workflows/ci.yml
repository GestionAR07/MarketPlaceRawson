name: CI

on:
  push:
    branches: [main, "feat/**", "chore/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture dependency evidence
        run: |
          npm audit --json > dependency-audit-full.json || true
          npm audit --omit=dev --json > dependency-audit-prod.json || true
          npm ls js-yaml vitest @vitest/mocker drizzle-kit @esbuild-kit/esm-loader @esbuild-kit/core-utils esbuild --all --json > dependency-tree.json || true
          cp package-lock.json package-lock.before.json
          npm update js-yaml --package-lock-only --ignore-scripts
          cp package-lock.json package-lock.after-js-yaml.json
          npm audit --json > dependency-audit-after-js-yaml.json || true

      - name: Upload dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-refresh-deep
          path: |
            dependency-audit-full.json
            dependency-audit-prod.json
            dependency-tree.json
            package-lock.before.json
            package-lock.after-js-yaml.json
            dependency-audit-after-js-yaml.json

      - name: Restore original lockfile
        run: cp package-lock.before.json package-lock.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smokes
        run: npm run e2e
